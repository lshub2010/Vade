name: ci

on:
  push:
    branches: [dev_gingshan, debug, main]
  pull_request:
    branches: [dev_gingshan, debug, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Build protocol core (.so)
        run: |
          cd protocol/core
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --features uniffi --lib -j 2
          cp target/debug/libvade_protocol.so python/

      - name: pytest
        env:
          PYTHONPATH: core:protocol/core/python
        run: python -m pytest core/tests -q

      - name: Contract gates
        env:
          PYTHONPATH: core:protocol/core/python
        run: |
          python tools/check_contracts.py
          python docs/check_docs.py
          python tools/check_ledger.py

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install
        working-directory: admin-ui
        run: npm ci

      - name: Build
        working-directory: admin-ui
        run: npm run build

      - name: dist matches source
        run: |
          # 构建必须可复现：dist 与源码不同步（含未跟踪文件）就失败。
          git diff --exit-code -- admin-ui/dist
          test -z "$(git status --porcelain -- admin-ui/dist)"

