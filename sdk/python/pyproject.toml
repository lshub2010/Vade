[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vade-sdk"
version = "0.1.0"
description = "Vade module SDK — connect, register tools, serve tool calls (C-07 frozen surface)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vade" }]
# Zero hard dependencies: `--standalone` must run on a bare Python.
# Connecting to core needs the C-01 protocol binding (`vade_protocol`) and
# `websockets`; both are imported lazily only on the transport path.
dependencies = []

[project.optional-dependencies]
core = ["websockets>=13", "cryptography>=42"]

[tool.hatch.build.targets.wheel]
packages = ["vade_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
