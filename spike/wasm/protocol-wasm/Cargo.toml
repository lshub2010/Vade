[package]
name = "protocol-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snow = "0.9"
chacha20poly1305 = "0.10"
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# getrandom on wasm32-unknown-unknown has no OS entropy source. Both major
# versions are pulled in by the graph (rand 0.8 -> getrandom 0.2,
# rand 0.9 -> getrandom 0.3), so both features must be enabled or
# `snow::Builder::generate_keypair()` panics at runtime.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
