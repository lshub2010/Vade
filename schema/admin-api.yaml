openapi: 3.1.0
info:
  title: Vade admin plane API
  version: 1.0.0
  x-contract-id: C-08
  x-owner: C5a
  x-status: frozen
  x-frozen-at: "2026-11-13"
  x-consumers: [C5b, F1, U1]
  description: |
    管理面契约。**独立 listener**：`https://127.0.0.1:8444`，不与数据面 `:8443` 同源——
    数据面上跑的是 `ui` 模块的第三方代码，同源等于把 `/admin/api/nodes`、审计和吊销接口
    交给一个 XSS。`GET :8443/admin` 必须 404。

    ## 会话模型
    | mode | 凭据 | 权限 |
    |---|---|---|
    | `device` | `Authorization: Bearer`（access 15min / refresh 30d） | 全功能 |
    | `browser` | `__Host-ac_admin` cookie（仅密码） | **只读**；已认证的非 GET 业务请求 → `403 READ_ONLY_SESSION` |

    非回环**写操作**一律要求设备挑战签名（双因素）；远程仅密码只能拿到只读的 `browser` 会话。
    拒绝理由只有 `AUTH_FAILED` 一种，不区分「密码错 / 设备未登记 / 签名错」。

    ## 闸门顺序
    `GET /admin/setup` 在非回环且未解锁时 **只** 返回 `{setup_required, requires_token}`；
    `bind_url` / `fp8` / `acs_` 只能经 `POST /admin/setup/unlock` 换取。二维码的闸在 unlock，
    不在前端是否渲染。

    ## 错误
    统一 `{code, message}`，`code` 只能是 `schema/errors.json` 的 33 个之一（`ErrorCode`）。
    `message` ≤ 300 字符，绝不回显密钥、token 或原始异常文本。

    ## 实现状态
    标记 `x-vade-implemented: false` 的操作已在契约中冻结、实现返回 `501 UNSUPPORTED`——
    C5b / F1 可照契约写 mock，不会因为本批没写完而改契约。
servers:
  - url: https://127.0.0.1:8444
    description: admin plane（默认回环；`--admin-bind` 才对外，对外必须 TLS）
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: setup
    description: 首次配置；只在未初始化时可用
  - name: auth
    description: 密码 + 设备挑战签名
  - name: devices
    description: 已登记设备（公钥永不返回）
  - name: nodes
    description: 模块/节点治理（数据来自 C2 registry 查询面）
  - name: invites
    description: 配对码（一个码只服务一个用途）
  - name: audit
    description: 只追加审计
  - name: governance
    description: 配置、布局、技能、记忆
  - name: stream
    description: SSE

paths:
  # ------------------------------------------------------------------ setup
  /admin/setup:
    get:
      tags: [setup]
      summary: 首次配置状态（二维码的闸门）
      security: []
      responses:
        "200":
          description: |
            未初始化 + 回环 → 含 `bind_url` 与 `fp8`；
            未初始化 + 非回环 + 未解锁 → **只有** `requires_token`；
            未初始化 + 已解锁 → 含 `bind_url` 与 `fp8`；
            已初始化 → **302 `/login`**（不返回 JSON）。
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupState"}
        "302":
          description: 已初始化，跳转 `/login`
    post:
      tags: [setup]
      summary: 初始化（电脑路径）
      security: []
      description: |
        回环免 token；非回环缺/错 `setup_token` → `401 SETUP_UNAUTHORIZED`。
        写入顺序：先 `admin.json`（tmp + `os.replace`）→ 再 unlink `setup.token`。
        已初始化后本端点 404（残留 token 文件也不认）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string, description: "`acs_` + 43 字符；只从 body 读"}
                password: {type: string, minLength: 12}
                pubkey: {type: string, description: "可选；P-256 65B base64 或 ssh-ed25519 行"}
                alg: {type: string, enum: [p256, ed25519]}
              required: [password]
              additionalProperties: false
      responses:
        "200":
          description: 已初始化
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  initialized: {type: boolean}
                  device: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/setup/unlock:
    post:
      tags: [setup]
      summary: 用 setup token 解锁二维码（唯一的闸）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
              required: [setup_token]
              additionalProperties: false
      responses:
        "200":
          description: 解锁成功；同时下发 `__Host-ac_setup`（10 分钟、HttpOnly、SameSite=Strict、仅 setup 路由）
          headers:
            Set-Cookie:
              schema: {type: string}
              description: "__Host-ac_setup=…; Secure; HttpOnly; SameSite=Strict; Path=/"
          content:
            application/json:
              schema:
                type: object
                properties:
                  bind_url: {type: string, format: uri}
                  fp8: {type: string, pattern: "^[0-9a-f]{16}$"}
                  expires_at: {type: integer}
                required: [bind_url, fp8, expires_at]
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  # ------------------------------------------------------------------- bind
  /admin/bind/info:
    get:
      tags: [setup]
      summary: 绑定问候（App 用已 pin 的 core_pub 验 hello_sig）
      security: []
      parameters:
        - name: X-Bind-Ticket
          in: header
          required: true
          schema: {type: string, pattern: "^[A-Z2-9]{26}$"}
      responses:
        "200":
          description: 票有效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BindInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/bind:
    post:
      tags: [setup]
      summary: 绑定设备（信封加密；先验后删）
      security: []
      x-vade-implemented: true
      description: |
        `{ticket, eph_pub, nonce, ct}`，ticket 明文，其余在密文里。
        AAD = `"vade-bind-v1" ‖ fp8 ‖ SHA256(ticket) ‖ challenge ‖ kex_pub`。
        未初始化时同时完成 setup。**失败不消费票**（先验后删）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BindRequest"}
      responses:
        "200":
          description: 绑定成功，返回 Bearer 会话（`mode=device`）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  # ------------------------------------------------------------------- auth
  /admin/api/login/challenge:
    post:
      tags: [auth]
      summary: 取挑战（无鉴权）
      security: []
      description: |
        60s 一次性，绑定 `challenge_id` + 来源 IP `/24` + 设备表版本。
        **不绑 TLS session id**（HTTP/2 连接池下不唯一）。
      responses:
        "200":
          description: 挑战与已登记设备（不含公钥）
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id: {type: string}
                  challenge: {type: string, description: "base64(32B)"}
                  expires_at: {type: integer}
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: {type: string}
                        label: {type: string}
                        fp8: {type: string}
                        alg: {type: string, enum: [p256, ed25519]}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /admin/api/login:
    post:
      tags: [auth]
      summary: 登录（密码 + 可选设备签名）
      security: []
      description: |
        签名对象 = `"vade-admin-v2\n" ‖ challenge(b64) ‖ "\n" ‖ admin_origin`。
        先验密码（常数时间），再验签名（按 `alg` 分派；P-256 必须拒 high-S）。
        任一失败 `401 AUTH_FAILED`，challenge 立即作废，计数合并（防探测）。

        - 回环 + `X-AC-Client: cli` → `mode=device`，返回 Bearer，**不设 cookie**。
        - 回环无签名无该头 → `mode=browser`，**只 Set-Cookie，响应体无任何 token**。
        - 非回环 + 密码 + 设备签名 → `mode=device`，返回 Bearer，**不设 cookie**。
        - 非回环 + 仅密码 → `mode=browser` 只读会话（`403 READ_ONLY_SESSION` 于所有写操作）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_id: {type: string}
                password: {type: string}
                device_id: {type: string}
                signature: {type: string, description: "base64"}
              required: [challenge_id, password]
              additionalProperties: false
      responses:
        "200":
          description: |
            `mode=device` → `{access_token, refresh_token, expires_in, mode}`，无 `Set-Cookie`；
            `mode=browser` → `{mode, expires_in, csrf_token}` + `Set-Cookie: __Host-ac_admin=…`
          headers:
            Set-Cookie:
              schema: {type: string}
              description: "仅 browser 模式：__Host- 前缀 + Secure + HttpOnly + SameSite=Strict + Path=/，不含 Domain"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/BrowserSession"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /admin/api/token/refresh:
    post:
      tags: [auth]
      summary: 刷新 access（每次都要设备签名）
      security: []
      description: 签名内容含 `refresh_jti`；只偷到 refresh token 续不了期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string}
                signature: {type: string}
                device_id: {type: string}
              required: [refresh_token, signature]
      responses:
        "200":
          description: 新会话
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/api/logout:
    post:
      tags: [auth]
      summary: 登出当前会话（browser 模式清 cookie）
      responses:
        "200":
          description: 已登出
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/api/logout-all:
    post:
      tags: [auth]
      summary: 吊销当前账户全部会话（含自己，用于「设备丢了」）
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  revoked: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/api/password:
    post:
      tags: [auth]
      summary: 改密（成功后吊销除当前外所有会话）
      description: 密码最短 12 字符，拒绝常见弱密码表；`role` 不支持（v1 只有一个管理员）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password: {type: string}
                new_password: {type: string, minLength: 12}
              required: [old_password, new_password]
              additionalProperties: false
      responses:
        "200":
          description: 已改密；返回当前会话的新 token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # ---------------------------------------------------------------- devices
  /admin/api/devices:
    get:
      tags: [devices]
      summary: 设备列表（**不返回公钥原文**）
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
                  max: {type: integer, const: 5}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [devices]
      summary: 登记新设备（step-up：body 里必须是当前密码）
      description: 上限 5 台，超出 `BIND_DEVICE_LIMIT`（不自动淘汰）。**不是匿名入口**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string}
                pubkey: {type: string}
                alg: {type: string, enum: [p256, ed25519]}
                label: {type: string, maxLength: 64}
                hardware_backed: {type: boolean}
              required: [password, pubkey]
              additionalProperties: false
      responses:
        "200":
          description: 已登记
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /admin/api/devices/{id}/revoke:
    post:
      tags: [devices]
      summary: 吊销设备并踢掉它换发的所有会话（立即生效）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, description: "可选 step-up"}
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/api/devices/ticket:
    post:
      tags: [devices]
      summary: 加一台新设备的绑定票（step-up）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string}
              required: [password]
      responses:
        "200":
          description: 10 分钟一次性
          content:
            application/json:
              schema:
                type: object
                properties:
                  bind_ticket: {type: string, pattern: "^[A-Z2-9]{26}$"}
                  bind_url: {type: string, format: uri}
                  expires_at: {type: integer}
                required: [bind_ticket, bind_url, expires_at]
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # ------------------------------------------------------------------ nodes
  /admin/api/nodes:
    get:
      tags: [nodes]
      summary: 节点列表（字段白名单）
      description: |
        字段白名单：id, kind, module_id, instance_id, label, capabilities, state, endpoint,
        protocol, version, auth_mode, rtt_ms, last_seen, x, y, revoked, tool_count, tool_names。
        `endpoint` 只保留 `scheme://host:port`；不透传 manifest、公钥、PSK、pair_code、header。
      responses:
        "200":
          description: 节点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Node"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/api/nodes/{id}:
    get:
      tags: [nodes]
      summary: 单节点详情
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 节点
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [nodes]
      summary: 启用/停用、并发模型覆盖、risk 覆盖
      description: |
        响应必须含影响面 `impact` 与 `audit_id`——C5b 的确认弹窗不能前端自己数。
        降低 risk → `403 RISK_DOWNGRADE_FORBIDDEN`。
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                concurrency: {type: string, enum: [exclusive, pooled, mirrored]}
                risk:
                  type: object
                  additionalProperties: {type: string, enum: [low, medium, high]}
                label: {type: string, maxLength: 64}
              additionalProperties: false
      responses:
        "200":
          description: 已应用
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: string}
                  impact: {$ref: "#/components/schemas/Impact"}
                  audit_id: {type: string}
                required: [ok, impact]
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/api/nodes/{id}/revoke:
    post:
      tags: [nodes]
      summary: 吊销节点（破坏性）
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  connections_closed: {type: integer}
                  audit_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/api/nodes/{id}/disconnect:
    post:
      tags: [nodes]
      summary: 断开并等待重连
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 已断开
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ---------------------------------------------------------------- invites
  /admin/api/invites:
    post:
      tags: [invites]
      summary: 创建邀请位（pair_code 明文**仅此一次**）
      description: |
        `purpose=module` 必须带 `module_id`；一个码只服务一个用途（`module` 走 XX 配对，
        `browser` 换 cookie）。响应还要带 `node_id`，模块接入时绑同一个节点，
        否则画布会多出节点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: {type: string, enum: [module, browser], default: module}
                module_id: {type: string}
                ttl: {type: integer, default: 600}
              additionalProperties: false
      responses:
        "200":
          description: 邀请位
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_id: {type: string}
                  pair_code: {type: string}
                  purpose: {type: string}
                  node_id: {type: [string, "null"]}
                  expires_at: {type: integer}
                  qr_payload: {type: string}
                required: [invite_id, pair_code, purpose, expires_at]
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/api/invites/{id}:
    delete:
      tags: [invites]
      summary: 撤销邀请
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ audit
  /admin/api/audit:
    get:
      tags: [audit]
      summary: 审计查询 / 回放
      description: 只返回 digest 与脱敏后的参数，**不返回参数原文**。`turn_id` 用于按轮次回放。
      parameters:
        - {name: from, in: query, schema: {type: number}}
        - {name: to, in: query, schema: {type: number}}
        - {name: module_id, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: turn_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: 审计页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AuditRow"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/api/approvals/decide:
    post:
      tags: [audit]
      summary: 审批决定（扩展端点；规范路径是 C3 的 `approval/decide` RPC）
      x-vade-extension: true
      description: |
        `by` 由服务端从会话推导，**不接受客户端自报**。`browser` 会话在到达这里之前就被
        `READ_ONLY_SESSION` 拒绝；即使绕过，`actor_kind=browser_session` 也会得到
        `403 APPROVER_INVALID`。重复决定 → `409`（`INVALID_ARGUMENT`，已解析）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: {type: string}
                decision: {type: string, enum: [allow, deny]}
                scope: {type: string, enum: [once, session], default: once}
              required: [request_id, decision]
      responses:
