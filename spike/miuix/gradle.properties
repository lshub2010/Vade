# Shared build settings.
#
# Host for this pass: Windows 11 x86_64, 16 cores / 16 GB (the first pass ran on
# an aarch64 Linux box with 8 cores / ~5 GB, so the memory knobs are looser here
# and the aapt2 override is gone -- see RESULT.md, section 八、本机适配清单).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=false
#
# AGP 8.8 officially supports compileSdk 35; API 36 (Android 16) is only used to
# compile against the platform jar, which works. Suppress the warning so a
# supported-but-newer SDK does not read as a build failure.
android.suppressUnsupportedCompileSdk=36
#
# Wasm toolchain: nothing in this project (here or in any build script) overrides
# Kotlin/JS's node provisioning, so KGP keeps its default download=true and fetches
# its own Node into $GRADLE_USER_HOME/nodejs -- node-v26.2.0-win-x64 + yarn-v1.22.22
# on this host. The node 22 on PATH is NOT what webpack runs on.
# The npm registry is pinned user-side in ~/.npmrc
# (registry=https://registry.npmmirror.com, behind a local proxy), which is why there
# is deliberately no repo-level npm/nodejs config here.
