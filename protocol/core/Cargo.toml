[package]
name = "vade-protocol-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Vade protocol v1 core: Noise IK / XXpsk3 handshake, length-prefixed framing, ChaCha20-Poly1305 transport, replay defence. Pure library: bytes in, bytes out, no IO."

[lib]
name = "vade_protocol"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# UniFFI surface (proven by C0a). Off by default so the wasm build stays lean.
uniffi = ["dep:uniffi"]
# Builds the KAT generator binary (src/bin/gen-kat.rs). Not part of the library surface.
kat-gen = []

[dependencies]
# Pinned. C0a verified 0.10.0 through UniFFI; C0b used 0.9.x. C1 unifies on 0.10.0
# (see protocol/v1/frames.md §7.1). Do not bump without regenerating kat.json.
snow = "=0.10.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uniffi = { version = "=0.32.2", features = ["cli"], optional = true }

[[bin]]
name = "gen-kat"
path = "src/bin/gen-kat.rs"
required-features = ["kat-gen"]

# Already in the graph as normal dependencies; declared here so integration
# tests can drive the primitives directly (KAT verification, foreign prologue).
[dev-dependencies]
chacha20poly1305 = "0.10"
hex = "0.4"
snow = "=0.10.0"
serde_json = "1"

[[bench]]
name = "aead"
harness = false

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]
