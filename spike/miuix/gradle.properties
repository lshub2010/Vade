// Shared build settings.
// Machine is a shared 8-core / ~5GB box: keep daemons modest and workers low,
// otherwise the Kotlin daemon gets OOM-killed in the middle of linking.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
# The Kotlin daemon cannot start under this box's memory pressure (two other
# agents' daemons are resident). Compiling in-process is slower per build but
# removes 4 retries x timeout before every fallback compile.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# Miuix pulls androidx.* (lifecycle, navigationevent, collection) through its
# KMP metadata; KGP refuses to wire the npm/webpack graph until this is on.
android.useAndroidX=true
android.enableJetifier=false

# --- Android on aarch64 -------------------------------------------------------
# The host is aarch64. Google only ships an x86_64 aapt2 with build-tools, so
# AGP's bundled aapt2 dies with "Exec format error". Debian's android-sdk
# package ships a native aarch64 aapt2; point AGP at it. aapt2 is the only
# native tool AGP needs for assembleDebug (d8/r8/apksigner are JVM code).
android.aapt2FromMavenOverride=/usr/lib/android-sdk/build-tools/debian/aapt2
# AGP 8.8 officially supports compileSdk 35; API 36 (Android 16) is only used
# to compile against the platform jar, which works. Suppress the warning so a
# supported-but-newer SDK does not read as a build failure.
android.suppressUnsupportedCompileSdk=36
