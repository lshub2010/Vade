# Nginx sample — reverse proxy for the Vade core DATA PLANE only.
#
# Drop-in for /etc/nginx/conf.d/vade.conf (conf.d is included inside http{},
# which is where `map` must live):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/vade.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The core runs on 127.0.0.1:8443 with no TLS of its own. Keep `Host $host`:
# the core's WebSocket origin check compares the Origin's host to the Host it
# received. Rewriting Host to 127.0.0.1 would make that check fail.
#
# The ADMIN plane (127.0.0.1:8444) is deliberately NOT proxied — its Host
# allow-list is [core].admin_host plus 127.0.0.1:8444/localhost:8444, so any
# other vhost gets 403 ORIGIN_MISMATCH. Use an SSH tunnel;
# see docs/DEPLOYMENT.md §10.3.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vade_data_plane {
    server 127.0.0.1:8443;
    keepalive 16;
}

server {
    listen 443 ssl;
    # nginx < 1.25.1: use `listen 443 ssl http2;` instead of the two lines.
    http2 on;
    server_name vade.example.com;

    ssl_certificate     /etc/letsencrypt/live/vade.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vade.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Must be >= [attach].max_bytes (default 100 MiB). Otherwise a large
    # upload fails here with an HTML 413 instead of the core's JSON error.
    client_max_body_size 110m;

    location / {
        proxy_pass http://vade_data_plane;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # /ws is long-lived; the core heartbeats every 10 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Do not batch event frames.
        proxy_buffering off;
    }

    # Optional: serve the web client from the same origin, so no CORS is
    # needed and Origin == Host for the WebSocket upgrade.
    # location /app/ {
    #     alias /srv/vade-web/;
    #     try_files $uri $uri/ /app/index.html;
    # }
}

# ---------------------------------------------------------------------------
# Do not do this (kept as a warning):
#
# server {
#     server_name admin.vade.example.com;
#     location / { proxy_pass http://127.0.0.1:8444; }
# }
#
# Every request returns 403 ORIGIN_MISMATCH: the admin plane only accepts
# Host/Origin == [core].admin_host (default 127.0.0.1:8444).
# ---------------------------------------------------------------------------
