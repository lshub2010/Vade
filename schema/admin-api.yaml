  # --------------------------------------------------------------- stream
  /admin/api/stream:
    get:
      tags: [stream]
      summary: "SSE（`Last-Event-ID` 续传；15s `: ping`）"
      description: |
        事件格式 `id: <seq>\ndata: <json>\n\n`；增量事件 `node.upsert` / `edge.state` / `node.remove`。
        `node.upsert` 的 data 是 `{id, node}`，`node` 为**完整** `Node` 视图（同 `/admin/api/nodes`
        的字段白名单）；L2 编辑额外带 `changes`（enabled/concurrency/risk），它只是给审计型消费方
        的附注，**不足以**更新画布。`state`/`rtt_ms`/`last_seen`/`tool_count` 变化（心跳恢复、
        断连、租约超时）同样发布 `node.upsert`。
        **序号复用 C3 的 replay seq**，不另造一套。记忆内容不进 SSE。
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/api/health:
    get:
      tags: [stream]
      summary: 探活（无鉴权）
      security: []
      description: |
        回环 → `{ok, version, e2e_enabled, audit}`；对外绑定 → **只** `{ok:true}`（不泄露版本）。
        回环的 `audit` 是审计链自身的计数器：生产写路径是异步的（`record()` 入队即返回
        `audit_id`），失败只发生在刷盘线程里，没有这组数字就只能翻日志。
      responses:
        "200":
          description: 存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {const: true}
                  version: {type: string}
                  e2e_enabled: {type: boolean}
                  audit:
                    type: object
                    description: 审计写入健康（仅回环返回；`ok` 不为它翻转，探活语义不变）
                    properties:
                      installed: {type: boolean, description: "是否安装了 audit writer"}
                      degraded: {type: boolean, description: "队列满而退化为同步写（仍在工作，但慢）"}
                      request_failures:
                        type: integer
                        description: "`write_audit` 捕获的失败次数（入队/同步写就抛出的那部分）"
                      writer_failures:
                        type: integer
                        description: "刷盘线程重试一次后仍未落盘的批次数（已进死信）"
                      write_retries:
                        type: integer
                        description: "第一次失败、重试成功的批次数（健康系统在 prune 竞争下也会涨）"
                      dead_letters:
                        type: integer
                        description: "已写入死信文件的行数（可恢复，和丢失不同）"
                      total_failures:
                        type: integer
                        description: "`request_failures + writer_failures`，告警用单值"
                      deadletter_path:
                        type: [string, "null"]
                        description: "死信文件路径（`audit.deadletter.jsonl`），每行一条带 `audit_id` 的 JSON"
                    required: [installed, request_failures, writer_failures, dead_letters, total_failures]
                required: [ok]

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    Name:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
    NodeId:
      name: id
      in: path
      required: true
      description: "`<module_id>#<instance_id>`"
      schema: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 设备模式；全功能；access 15 分钟，refresh 30 天（刷新需设备签名）
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ac_admin
      description: 浏览器模式；**只读**。必须 `__Host-` 前缀，非该前缀的 cookie 一律不认
  schemas:
    Ok:
      type: object
      properties:
        ok: {type: boolean}
        audit_id: {type: string}
      required: [ok]
    Error:
      type: object
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string, maxLength: 300}
      required: [code, message]
      additionalProperties: false
    ErrorCode:
      type: string
      description: C-04 的 33 个码；模块/管理面都不得新造。
      enum:
        - INVALID_ARGUMENT
        - NOT_FOUND
        - PERMISSION_DENIED
        - TIMEOUT
        - CANCELLED
        - UNAVAILABLE
        - OVERLOADED
        - MEMORY_FULL
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED
        - PROTOCOL_MISMATCH
        - MANIFEST_INVALID
        - TOOL_CONFLICT
        - RISK_DOWNGRADE_FORBIDDEN
        - APPROVER_INVALID
        - ORIGIN_MISMATCH
        - READ_ONLY_SESSION
        - BIND_UNAUTHORIZED
        - BIND_FINGERPRINT_MISMATCH
        - BIND_HELLO_SIG_INVALID
        - BIND_DEVICE_LIMIT
        - BIND_CLOCK_SKEW
        - BIND_KEY_UNSUPPORTED
        - BIND_SETUP_LOCKED
        - AUTH_FAILED
        - ADMIN_LOCKED
        - SETUP_UNAUTHORIZED
        - MODULE_DRAINING
        - INTERNAL
        - CONFIRM_REQUIRED
        - UNKNOWN_CONFIG_KEY
        - CODE_INVALID
        - CODE_EXPIRED
    SetupState:
      type: object
      properties:
        setup_required: {type: boolean}
        requires_token: {type: boolean}
        bind_url: {type: string, format: uri}
        fp8: {type: string, pattern: "^[0-9a-f]{16}$"}
        expires_at: {type: integer}
      required: [setup_required]
      additionalProperties: false
      description: 非回环未解锁时**只有** `setup_required` 与 `requires_token`。
    BindInfo:
      type: object
      properties:
        core_pub: {type: string, description: "base64 raw Ed25519"}
        fp8: {type: string, pattern: "^[0-9a-f]{16}$"}
        kex_pub: {type: string}
        challenge: {type: string}
        setup_required: {type: boolean}
        expires_at: {type: integer}
        hello_sig: {type: string}
      required: [core_pub, fp8, kex_pub, challenge, setup_required, expires_at, hello_sig]
    BindRequest:
      type: object
      properties:
        ticket: {type: string, pattern: "^[A-Z2-9]{26}$"}
        eph_pub: {type: string}
        nonce: {type: string}
        ct: {type: string}
      required: [ticket, eph_pub, nonce, ct]
      additionalProperties: false
    TokenPair:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer, const: 900}
        mode: {type: string, const: device}
        csrf_token: {type: string}
      required: [access_token, refresh_token, expires_in, mode]
    BrowserSession:
      type: object
      description: 浏览器只读会话；**响应体不含任何 token**
      properties:
        mode: {type: string, const: browser}
        expires_in: {type: integer}
        csrf_token: {type: string}
      required: [mode, expires_in]
      additionalProperties: false
    Device:
      type: object
      description: 列表视图；**不返回公钥原文**
      properties:
        device_id: {type: string}
        label: {type: string}
        alg: {type: string, enum: [p256, ed25519]}
        fp8: {type: string}
        hardware_backed: {type: boolean}
        attested:
          type: boolean
          description: >-
            恒 `false`：`hardware_backed` 是设备自述，core 无法验证（design §7.12.3 ③）。
            与 `hardware_backed` 成对出现，UI 据此标「设备自述」而不是「已验证」。
            **不要拿它做授权判断。**
        added_at: {type: number}
        added_from_ip: {type: [string, "null"]}
        last_used_at: {type: [number, "null"]}
      required: [device_id, label, alg, fp8, hardware_backed, attested, added_at]
      additionalProperties: false
    Node:
      type: object
      description: 白名单视图，唯一出口是 `to_public_view`
      properties:
        id: {type: string}
        kind: {type: string, enum: [module, device]}
        module_id: {type: string}
        instance_id: {type: string}
        label: {type: [string, "null"]}
        capabilities:
          type: array
          description: >-
            能力**种类**，决定画布形状与分组（design §7.2/§7.7）。这里**不放工具名**——
            工具名/数量在 `tool_names` / `tool_count`。取值：`tools`（有工具）、
            `prompts` / `events`（声明了对应能力段）、`model`（`capabilities.models` 非空）、
            `memory` / `bridge`（模块类型约定）。客户端不要再按 `module_id` 子串猜形状。
          items:
            type: string
            enum: [tools, prompts, events, model, memory, bridge]
        state: {type: string, enum: [online, offline, pending, degraded, rejected]}
        endpoint:
          type: [string, "null"]
          description: "只保留 scheme://host:port；userinfo/query/fragment 被丢弃"
        protocol: {type: string, const: vade/v1}
        version: {type: [string, "null"]}
        auth_mode: {type: string, enum: [module_key, device_key, browser_session]}
        rtt_ms: {type: [number, "null"]}
        last_seen: {type: [number, "null"]}
        x: {type: [number, "null"]}
        y: {type: [number, "null"]}
        revoked: {type: boolean}
        tool_count: {type: integer}
        tool_names:
          type: array
          items: {type: string}
      required: [id, kind, module_id, instance_id, state, endpoint, revoked, tool_count, tool_names]
      additionalProperties: false
    Impact:
      type: object
      properties:
        tool_count: {type: integer}
        tool_names:
          type: array
          items: {type: string}
        sessions_affected: {type: integer}
        changes: {type: object}
      required: [tool_count, tool_names, sessions_affected]
    AuditRow:
      type: object
      properties:
        id: {type: integer}
        ts: {type: number}
        kind: {type: string}
        session_id: {type: [string, "null"]}
        turn_id: {type: [string, "null"]}
        module_id: {type: [string, "null"]}
        instance_id: {type: [string, "null"]}
        method: {type: [string, "null"]}
        tool: {type: [string, "null"]}
        duration_ms: {type: [number, "null"]}
        status: {type: [string, "null"]}
        code: {type: [string, "null"]}
        request_id: {type: [string, "null"]}
        actor: {type: [string, "null"], description: "确认人：设备 id / loopback_admin / system"}
        args_digest: {type: [string, "null"]}
        args_redacted:
          type: [object, "null"]
          description: 命中 password|token|secret|key|credential 的字段值替换为 `[redacted]`
        extra: {type: object}
    ConfigItem:
      type: object
      properties:
        key: {type: string}
        value: {}
        default: {}
        source: {type: string, enum: [default, core.toml, overrides, env, cli]}
        mode: {type: string, enum: [hot, restart]}
        min: {type: integer}
        max: {type: integer}
        values:
          type: array
          items: {type: string}
      required: [key, value, default, source, mode]
    Layout:
      type: object
      properties:
        rev: {type: integer}
        nodes:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              x: {type: number}
              y: {type: number}
              label: {type: [string, "null"]}
              group_id: {type: [string, "null"]}
            required: [id, x, y]
      required: [rev, nodes]
    SkillSummary:
      type: object
      properties:
        name: {type: string}
        revision: {type: integer}
        status: {type: string, enum: [active, pending, disabled, stale, unavailable]}
        origin: {type: string}
        created_by: {type: string}
        derived_from: {type: [string, "null"]}
      required: [name, revision, status]
    MemoryItem:
      type: object
      description: 只有条目正文与指针；不含 user_text / assistant_text
      properties:
        id: {type: string}
        text: {type: string}
        layer: {type: string, enum: [session, global]}
        namespace: {type: string}
        status: {type: string, enum: [staging, active, archived, superseded]}
        session_id: {type: [string, "null"]}
        turn_id: {type: [string, "null"]}
        created_at: {type: number}
        expires_at: {type: [number, "null"]}
        hit_count: {type: integer}
        supersedes:
          type: array
          items: {type: string}
      required: [id, layer, namespace, status, created_at]
  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: 未认证 / 认证失败（`AUTH_FAILED`、`SETUP_UNAUTHORIZED`、`BIND_UNAUTHORIZED`）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: 已认证但越权（`READ_ONLY_SESSION`、`APPROVER_INVALID`、`ORIGIN_MISMATCH`、`RISK_DOWNGRADE_FORBIDDEN`）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: 不存在（初始化前 `/admin/api/*` 也走这里）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: 冲突（`CONFIRM_REQUIRED`、`BIND_DEVICE_LIMIT`、布局 rev 冲突、重复 decision）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: 限流（`ADMIN_LOCKED`、`OVERLOADED`）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: 契约已冻结、实现未完成（`UNSUPPORTED`）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
